<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Personal Uploader — Authorization</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222;background:#fff}textarea{width:100%;height:110px;font-family:monospace;font-size:13px;box-sizing:border-box}button{padding:8px 16px;font-size:15px;cursor:pointer}.err{color:#b00020}</style></head><body>
<h1>Personal Uploader</h1>
<div id="ok" hidden>
<p>✅ TikTok authorization complete. Copy this address and paste it into the Personal Uploader terminal window:</p>
<textarea id="url" readonly></textarea>
<p><button id="copy">Copy</button> <span id="copied"></span></p>
</div>
<p id="fail" class="err" hidden></p>
<script>
const q = new URLSearchParams(location.search);
if (q.get("code")) {
  document.getElementById("ok").hidden = false;
  document.getElementById("url").value = location.href;
  document.getElementById("copy").onclick = () => {
    navigator.clipboard.writeText(location.href).then(() => document.getElementById("copied").textContent = "Copied");
  };
} else {
  const f = document.getElementById("fail");
  f.hidden = false;
  f.textContent = "Authorization was not completed" + (q.get("error") ? ": " + q.get("error") + " " + (q.get("error_description") || "") : ".");
}
</script>
</body></html>
